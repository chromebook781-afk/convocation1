<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convocation Poster Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
}

h2{
color:#1565C0;
}

input{
width:300px;
max-width:90%;
padding:12px;
font-size:18px;
border:1px solid #ccc;
border-radius:8px;
margin:10px;
}

button{
padding:12px 20px;
font-size:18px;
background:#1565C0;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin:10px;
}
#poster{
position:relative;
display:inline-block;
margin-top:20px;
}

#poster img{
width:800px;
max-width:100%;
display:block;
}
#name{
position:absolute;
left:50%;
top:75.8%;
transform:translate(-50%,-50%);
width:52%;
text-align:center;
font-size:26px;
font-weight:600;
font-family:"Times New Roman", serif;
color:#3d2b16;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
</style>
</head>
<body>

<h2>Convocation Poster Generator</h2>

<input
id="inputName"
type="text"
placeholder="Enter Your Name"
oninput="showName()">
#name{
position:absolute;
left:50%;
top:75.8%;
transform:translate(-50%,-50%);
width:52%;
text-align:center;
font-size:26px;
font-weight:600;
font-family:"Times New Roman", serif;
color:#3d2b16;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}<br>

<button onclick="downloadImage()">
Download Image
</button>

<div id="poster">

<img src="poster.png" alt="Poster">

<div id="name"></div>

</div>
<script>

function showName(){

let txt=document.getElementById("inputName").value;
let box=document.getElementById("name");

box.innerHTML=txt;

let size=42;

if(txt.length>20) size=34;
if(txt.length>30) size=28;
if(txt.length>40) size=22;

box.style.fontSize=size+"px";

}

function downloadImage(){

let input=document.getElementById("inputName");
let button=document.querySelector("button");

input.style.display="none";
button.style.display="none";

html2canvas(document.getElementById("poster"),{
scale:3
}).then(function(canvas){

let a=document.createElement("a");

a.download="convocation.png";
a.href=canvas.toDataURL();
a.click();

input.style.display="inline-block";
button.style.display="inline-block";

});

}

</script>

</body>
</html>
