
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convocation Poster Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
padding:20px;
background:#f5f5f5;
font-family:Arial,sans-serif;
text-align:center;
}

h2{
color:#082B73;
margin-bottom:20px;
}

input{
width:320px;
max-width:90%;
padding:12px;
font-size:18px;
border:2px solid #082B73;
border-radius:8px;
outline:none;
}

button{
padding:12px 24px;
margin:12px;
font-size:18px;
background:#082B73;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0B3A8A;
}

#poster{
position:relative;
display:inline-block;
}

#poster img{
width:800px;
max-width:100%;
display:block;
}

#name{
position:absolute;
left:50%;
top:79%;
transform:translate(-50%,-50%);
width:55%;
text-align:center;
font-size:28px;
font-weight:bold;
font-family:"Times New Roman",serif;
color:#082B73;
}

</style>

</head>
<body>

<h2>Convocation Poster Generator</h2>

<input
id="inputName"
type="text"
placeholder="Enter Your Name"
oninput="showName()">

<br>

<button onclick="downloadImage()">
Download Image
</button>

<br><br>

<div id="poster">

<img src="poster.png" alt="Poster">

<div id="name"></div>

</div>
<script>

function showName(){

let txt=document.getElementById("inputName").value;
let box=document.getElementById("name");

box.innerHTML=txt;

let size=28;

if(txt.length>20) size=24;
if(txt.length>30) size=20;
if(txt.length>40) size=18;

box.style.fontSize=size+"px";

}

function downloadImage(){

let input=document.getElementById("inputName");
let button=document.querySelector("button");

input.style.display="none";
button.style.display="none";

html2canvas(document.getElementById("poster"),{
scale:3
}).then(function(canvas){

let link=document.createElement("a");
link.download="convocation.png";
link.href=canvas.toDataURL("image/png");
link.click();

input.style.display="inline-block";
button.style.display="inline-block";

});

}

</script>

</body>
</html>
