<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convocation Poster Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef2f7;
font-family:Arial,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

h2{
margin-bottom:15px;
color:#082B73;
}

input{
width:320px;
max-width:90%;
padding:12px;
font-size:18px;
border-radius:8px;
border:1px solid #bbb;
outline:none;
margin-bottom:10px;
}

button{
padding:12px 22px;
font-size:17px;
border:none;
border-radius:8px;
background:#082B73;
color:#fff;
cursor:pointer;
margin:6px;
}

button:hover{
background:#0d3f9a;
}

#poster{
position:relative;
width:min(90vw,800px);
}

#poster img{
width:100%;
display:block;
}

#name{
position:absolute;
left:50%;
top:76.7%;
transform:translate(-50%,-50%);
width:64%;
height:7%;
display:flex;
align-items:center;
justify-content:center;
font-family:"Times New Roman",serif;
font-weight:bold;
font-size:clamp(16px,3vw,30px);
color:#082B73;
text-align:center;
white-space:nowrap;
overflow:hidden;
}
  #name::selection{
background:transparent;
}

@media (max-width:600px){

input{
width:92%;
font-size:16px;
}

button{
width:92%;
}

#poster{
width:98vw;
}

#name{
width:66%;
top:76.7%;
font-size:clamp(14px,3.6vw,26px);
}

}

</style>

</head>

<body>

<h2>Convocation Poster Generator</h2>

<input
type="text"
id="inputName"
placeholder="Enter Name">

<br>

<button onclick="showName()">
Show Name
</button>

<button onclick="downloadPoster()">
Download Image
</button>

<br><br>

<div id="poster">

<img src="poster.png" alt="Poster">

<div id="name"></div>
</div>

<script>

const input=document.getElementById("inputName");
const nameBox=document.getElementById("name");

function fitText(){

let size=30;

nameBox.style.fontSize=size+"px";

while(nameBox.scrollWidth>nameBox.clientWidth && size>14){
size--;
nameBox.style.fontSize=size+"px";
}

}

function showName(){

nameBox.textContent=input.value.trim();

fitText();

}

function downloadPoster(){

const btns=document.querySelectorAll("button");
const inp=document.getElementById("inputName");

btns.forEach(b=>b.style.display="none");
inp.style.display="none";

html2canvas(document.getElementById("poster"),{
scale:3,
useCORS:true
}).then(canvas=>{

const link=document.createElement("a");

link.download="convocation.png";

link.href=canvas.toDataURL("image/png");

link.click();

btns.forEach(b=>b.style.display="inline-block");
inp.style.display="inline-block";

});

}

window.addEventListener("resize",fitText);

</script>

</body>
</html>
