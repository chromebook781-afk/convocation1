<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Convocation Invitation Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
}

}
  <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#EEF3FF;

font-family:Arial,sans-serif;

display:flex;

flex-direction:column;

align-items:center;

padding:20px;

}

h1{

font-size:30px;

color:#082B73;

margin-bottom:20px;

text-align:center;

}

.controls{

width:100%;

max-width:540px;

display:flex;

gap:12px;

flex-wrap:wrap;

justify-content:center;

margin-bottom:20px;

}

#nameInput{

flex:1;

min-width:260px;

padding:14px;

font-size:18px;

border:2px solid #082B73;

border-radius:10px;

outline:none;

}

#downloadBtn{

padding:14px 22px;

background:#082B73;

color:#fff;

border:none;

border-radius:10px;

font-size:17px;

cursor:pointer;

transition:.25s;

}

#downloadBtn:hover{

background:#0B47BE;

}

#posterArea{

position:relative;

width:min(900px,95vw);

}

#poster{

display:block;

width:100%;

height:auto;

}

#studentName{

position:absolute;

left:50%;

top:76.45%;

transform:translate(-50%,-50%);

width:46%;

height:58px;

display:flex;

justify-content:center;

align-items:center;

font-family:"Cinzel",serif;

font-size:34px;

font-weight:600;

color:#082B73;

letter-spacing:.4px;

text-align:center;

white-space:nowrap;

overflow:hidden;

padding:0 8px;

line-height:1;

text-rendering:optimizeLegibility;

-webkit-font-smoothing:antialiased;

}

@media(max-width:700px){

h1{
font-size:24px;
}

#nameInput{
min-width:100%;
}

#downloadBtn{
width:100%;
}

#studentName{

font-size:28px;

height:46px;

width:47%;

}
</style>

</head>

<body>

<h1>🎓 Convocation Invitation Generator</h1>

<div class="controls">

<input
type="text"
id="nameInput"
placeholder="Enter Student Name"
maxlength="60"
autocomplete="off"
spellcheck="false">

<button id="downloadBtn">
Download Invitation
</button>

</div>

<div id="posterArea">

<img
id="poster"
src="poster.png"
alt="Convocation Poster">

<div id="studentName"></div>

</div>

<script>

const input = document.getElementById("nameInput");
const studentName = document.getElementById("studentName");
const downloadBtn = document.getElementById("downloadBtn");
const posterArea = document.getElementById("posterArea");

function fitName(){

const value = input.value.trim();

studentName.textContent = value;

let size = 34;
studentName.style.fontSize = size + "px";

while(
(studentName.scrollWidth > studentName.clientWidth ||
studentName.scrollHeight > studentName.clientHeight)
&& size > 18
){
size--;
studentName.style.fontSize = size + "px";
}

}

input.addEventListener("input", fitName);

window.addEventListener("load", fitName);

downloadBtn.addEventListener("click", async () => {
  const controls = document.querySelector(".controls");
    controls.style.display = "none";

    await document.fonts.ready;

    const canvas = await html2canvas(posterArea,{
        scale:4,
        useCORS:true,
        backgroundColor:null
    });

    controls.style.display = "flex";

    const link = document.createElement("a");

    const fileName = (input.value.trim() || "Convocation")
        .replace(/[^\w\s-]/g,"")
        .replace(/\s+/g,"_");

    link.download = fileName + "_Invitation.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

});

</script>

</body>
</html>
