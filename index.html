<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convocation Poster Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#eef3fb;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

h2{
color:#082B73;
margin-bottom:20px;
font-size:32px;
font-weight:bold;
}

input{
width:340px;
max-width:90%;
padding:12px;
font-size:18px;
border:2px solid #082B73;
border-radius:8px;
outline:none;
}

button{
margin-top:12px;
padding:12px 25px;
font-size:18px;
background:#082B73;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#0B3E99;
}

#poster{
position:relative;
display:inline-block;
margin-top:25px;
}

#poster img{
width:800px;
max-width:100%;
display:block;
}

#name{

position:absolute;

left:50%;
top:76.65%;

transform:translate(-50%,-50%);

width:48%;
height:42px;

display:flex;
align-items:center;
justify-content:center;

font-family:"Times New Roman",serif;
font-weight:bold;

font-size:26px;

color:#082B73;

text-align:center;

white-space:nowrap;
overflow:hidden;

line-height:1;

}

</style>

</head>
<body>

<h2>Convocation Poster Generator</h2>

<input
id="inputName"
type="text"
placeholder="Enter Your Name"
maxlength="60"
oninput="showName()">

<br><br>

<button onclick="downloadImage()">
Download Image
</button>

<br><br>

<div id="poster">

<img src="poster.png" alt="Convocation Poster">

<div id="name"></div>

</div>
<script>

function showName(){

const input = document.getElementById("inputName");
const name = document.getElementById("name");

name.textContent = input.value.trim();

let size = 26;

if(input.value.length > 16) size = 24;
if(input.value.length > 24) size = 22;
if(input.value.length > 32) size = 20;
if(input.value.length > 40) size = 18;
if(input.value.length > 50) size = 16;

name.style.fontSize = size + "px";

}

function downloadImage(){

const input = document.getElementById("inputName");
const button = document.querySelector("button");

input.style.display = "none";
button.style.display = "none";

html2canvas(document.getElementById("poster"),{
scale:3,
useCORS:true
}).then(function(canvas){

const link = document.createElement("a");

link.download = "convocation.png";
link.href = canvas.toDataURL("image/png");
link.click();

input.style.display = "";
button.style.display = "";

});

}

</script>
</body>
</html>
