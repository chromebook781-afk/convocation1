<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Convocation Invitation Generator
</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#edf2ff;

padding:20px;

display:flex;

flex-direction:column;

align-items:center;

}

h1{

color:#082B73;

margin-bottom:20px;

font-size:32px;

text-align:center;

}

.controls{

width:100%;

max-width:520px;

display:flex;

flex-wrap:wrap;

gap:12px;

justify-content:center;

margin-bottom:25px;

}

#nameInput{

flex:1;

min-width:260px;

padding:14px;

font-size:18px;

border:2px solid #082B73;

border-radius:10px;

outline:none;

}

button{

padding:14px 22px;

background:#082B73;

color:white;

font-size:17px;

border:none;

border-radius:10px;

cursor:pointer;

transition:.25s;

}

button:hover{

background:#0A3EA8;

}

#posterArea{

position:relative;

width:min(900px,95vw);

}

#poster{

width:100%;

display:block;

}

#studentName{

position:absolute;

left:50%;

top:76.5%;

transform:translate(-50%,-50%);

width:48%;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

white-space:nowrap;

overflow:hidden;

font-size:42px;

font-weight:700;

color:#082B73;

line-height:1;

letter-spacing:.3px;

}

@media(max-width:700px){

#studentName{

font-size:30px;

width:50%;

}

button{

width:100%;

}

#nameInput{

min-width:100%;

}

}
  </style>

</head>

<body>

<h1>🎓 Convocation Invitation Generator</h1>

<div class="controls">

<input
type="text"
id="nameInput"
placeholder="Enter Student Name"
maxlength="60"
autocomplete="off">

<button id="downloadBtn">
Download Invitation
</button>

</div>

<div id="posterArea">

<img
id="poster"
src="poster.png"
alt="Convocation Poster">

<div id="studentName"></div>

</div>
<script>

const input = document.getElementById("nameInput");
const nameText = document.getElementById("studentName");
const posterArea = document.getElementById("posterArea");
const downloadBtn = document.getElementById("downloadBtn");

function updateName() {

    let text = input.value.trim();

    if (text === "") {
        nameText.textContent = "";
        return;
    }

    nameText.textContent = text;

    let fontSize = 42;
    nameText.style.fontSize = fontSize + "px";

    while (
        nameText.scrollWidth > nameText.clientWidth &&
        fontSize > 18
    ) {
        fontSize--;
        nameText.style.fontSize = fontSize + "px";
    }
}

input.addEventListener("input", updateName);

window.addEventListener("load", updateName);

downloadBtn.addEventListener("click", async () => {

    const controls = document.querySelector(".controls");

    controls.style.display = "none";

    await document.fonts.ready;

    const canvas = await html2canvas(posterArea, {
        scale: 4,
        useCORS: true,
        backgroundColor: null
    });

    controls.style.display = "flex";

    const link = document.createElement("a");

    const filename =
        (input.value.trim() || "Convocation")
        .replace(/\s+/g, "_");

    link.download = filename + "_Invitation.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

});

</script>

</body>
</html>
