
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convocation Name Generator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
}


h2{
    color:#0b3d91;
}


.controls{
    margin-bottom:20px;
}


input{
    width:90%;
    max-width:350px;
    padding:12px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #ccc;
}


button{
    margin-top:12px;
    padding:12px 22px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#1565c0;
    color:white;
    cursor:pointer;
}


button:hover{
    background:#0d47a1;
}


/* Poster Area */

#poster{
    position:relative;
    display:inline-block;
    width:100%;
    max-width:800px;
}


#poster img{
    width:100%;
    height:auto;
    display:block;
}


/* Name Position */

#studentName{

    position:absolute;

    left:50%;

    top:72%;

    transform:translate(-50%,-50%);

    width:80%;

    text-align:center;

    color:#003b8f;

    font-weight:bold;

    font-size:45px;

    line-height:1.2;

    white-space:nowrap;

    overflow:hidden;

}


/* Mobile adjustment */

@media(max-width:600px){

    #studentName{

        font-size:28px;

        width:85%;

        top:72%;

    }

}


</style>

</head>


<body>


<h2>Convocation Name Generator</h2>


<div class="controls">

<input id="nameInput" 
placeholder="Enter Student Name"
oninput="showName()">


<br>

<button onclick="downloadImage()">
Download Image
</button>


</div>


<div id="poster">

<img src="poster.png" id="posterImage">


<div id="studentName">
</div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

function showName(){

    let input = document.getElementById("nameInput").value;

    let nameBox = document.getElementById("studentName");

    nameBox.innerText = input;

    autoFitText();

}


// Auto resize long names

function autoFitText(){

    let nameBox = document.getElementById("studentName");

    let parentWidth = document.getElementById("poster").offsetWidth;

    let size = parentWidth * 0.055;


    nameBox.style.fontSize = size + "px";


    while(nameBox.scrollWidth > nameBox.clientWidth){

        size--;

        nameBox.style.fontSize = size + "px";


        if(size < 10){
            break;
        }

    }

}



// Download HD image

function downloadImage(){

    let poster = document.getElementById("poster");


    html2canvas(poster,{

        scale:3,

        useCORS:true,

        backgroundColor:null

    }).then(canvas=>{


        let link=document.createElement("a");


        link.download="convocation-name.png";


        link.href=canvas.toDataURL("image/png");


        link.click();


    });


}


// Mobile resize support

window.addEventListener("resize",()=>{

    autoFitText();

});


</script>


</body>
</html>

</div>
