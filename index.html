<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convocation Poster Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f2f5fa;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

h2{
color:#082B73;
margin-bottom:20px;
font-size:32px;
}

input{
width:330px;
max-width:90%;
padding:12px;
font-size:18px;
border:2px solid #082B73;
border-radius:8px;
outline:none;
}

button{
margin-top:12px;
padding:12px 24px;
background:#082B73;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0A3B94;
}

#poster{
position:relative;
display:inline-block;
margin-top:25px;
}

#poster img{
width:800px;
max-width:100%;
display:block;
}

#name{
position:absolute;
left:50%;
top:80.8%;
transform:translate(-50%,-50%);
width:54%;
height:48px;

display:flex;
align-items:center;
justify-content:center;

font-family:"Times New Roman",serif;
font-size:24px;
font-weight:bold;

color:#082B73;

text-align:center;
line-height:1;

white-space:nowrap;
overflow:hidden;
}

</style>

</head>
<body>

<h2>Convocation Poster Generator</h2>

<input
id="inputName"
type="text"
placeholder="Enter Your Name"
oninput="showName()">

<br>

<button onclick="downloadImage()">
Download Image
</button>

<br><br>

<div id="poster">

<img src="poster.png" alt="Poster">

<div id="name"></div>

</div>
<script>

function showName(){

let txt = document.getElementById("inputName").value;
let box = document.getElementById("name");

box.innerHTML = txt;

let size = 24;

if(txt.length > 18) size = 22;
if(txt.length > 26) size = 20;
if(txt.length > 34) size = 18;
if(txt.length > 42) size = 16;

box.style.fontSize = size + "px";

}

function downloadImage(){

const input = document.getElementById("inputName");
const button = document.querySelector("button");

input.style.display = "none";
button.style.display = "none";

html2canvas(document.getElementById("poster"),{
scale:3,
backgroundColor:null
}).then(function(canvas){

const link = document.createElement("a");

link.download = "convocation.png";
link.href = canvas.toDataURL("image/png");
link.click();

input.style.display = "";
button.style.display = "";

});

}

</script>

</body>
</html>
